<div class="doctors-page-container">
  <h2>Doctors List</h2>
<button [routerLink]="['']">Home</button>
  @let s = state();
  @if (s.status === 'loading') {
    <p>Loading Doctors...</p>
  } @else if (s.status === 'error') {
    <p> {{ s.message }}</p>
  } @else if (s.data.length === 0) {
    <p>No Doctors available at the moment.</p>
  } @else {
    <div class="grid">
      @for (doctor of s.data; track doctor._id) {
        <app-doctor-card [doctor]="doctor" />
      }
    </div>
  }
</div>
