<div class="medicalrecords-page-container">
  <h2>Records List</h2>
<button [routerLink]="['']">Home</button>
  @let s = state();
  @if (s.status === 'loading') {
    <p>Loading medicalRecords...</p>
  } @else if (s.status === 'error') {
    <p> {{ s.message }}</p>
  } @else if (s.data.length === 0) {
    <p>No medicalRecords available at the moment.</p>
  } @else {
    <div class="grid">
      @for (medicalRecord of s.data; track medicalRecord._id) {
        <app-medicalrecord-card [medicalrecord]="medicalRecord" />
      }
    </div>
  }
</div>
