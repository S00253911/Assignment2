<form [formGroup]="patientForm" (ngSubmit)="onSubmit()" class="patient-form">
  <h2>Patient Form</h2>


  <!-- First Name Field -->
  <div class="form-group">
    <label for="firstName">First Name:</label>
    <input id="firstName" type="text" formControlName="firstName" placeholder="e.g. Bobby" />
  </div>

  <!-- Last Name Field -->
  <div class="form-group">
    <label for="lastName">Last Name:</label>
    <input id="lastName" type="text" formControlName="lastName" placeholder="e.g. Ross" />
    
  </div>

  <!-- Age Field -->
  <div class="form-group">
    <label for="age">Age:</label>
    <input id="age" type="number" formControlName="age" placeholder="e.g. 2004" />
  </div>

  <!-- EirCode Field -->
  <div class="form-group">
    <label for="eirCode">EirCode:</label>
    <input id="eirCode" type="text" formControlName="eirCode" placeholder="e.g. F26 X4532" />
  </div>
  
  <!-- Year Field -->
  <div class="form-group">
    <label for="attendingDoctor">Doctor:</label>
    <input id="attendingDoctor" type="text" formControlName="attendingDoctor" placeholder="e.g. 15342123" />
  </div>

  <!-- Action Buttons -->
  @if (saveError(); as message) { <p role="alert">{{ message }}</p> }
  <div class="button-group">
    <button type="submit" [disabled]="saving()">
      {{ saving() ? 'Saving...' : 'Save patient' }}
    </button>
    <a routerLink="/patients">Cancel</a>
  </div>
