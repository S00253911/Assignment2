<form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()" class="appointment-form">
  <h2>Appointment Form</h2>

 <!-- patient Field -->
  <div class="form-group">
    <label for="patient">Patient:</label>
    <input id="patient" type="text" formControlName="patient" placeholder="e.g. Jimmy" />
  </div>

  <!-- Doctor Field -->
  <div class="form-group">
    <label for="doctor">Doctor:</label>
    <input id="doctor" type="text" formControlName="doctor" placeholder="e.g. Bobby" />
  </div>

  <!-- Date Field -->
  <div class="form-group">
    <label for="date">Date:</label>
    <input id="date" type="date" formControlName="date" placeholder="e.g. 24-10-2004" />
    
  </div>

  <!-- Time Field -->
  <div class="form-group">
    <label for="time">Time:</label>
    <input id="time" type="string" formControlName="time" placeholder="e.g. 8pm" />
  </div>

  <!-- Reason Field -->
  <div class="form-group">
    <label for="reason">Reason:</label>
    <input id="reason" type="text" formControlName="reason" placeholder="e.g. Big Toe Hurting" />
  </div>

  <!-- Action Buttons -->
  @if (saveError(); as message) { <p role="alert">{{ message }}</p> }
  <div class="button-group">
    <button type="submit" [disabled]="saving()">
      {{ saving() ? 'Saving...' : 'Save Appointment' }}
    </button>
    <a routerLink="/appointments">Cancel</a>
  </div>
